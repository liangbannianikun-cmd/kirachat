plugins {
    id "com.android.application"
}

def pointsServerUrl = (project.findProperty("POINTS_SERVER_URL") ?: "").toString()
def escapedPointsServerUrl = pointsServerUrl
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")

android {
    compileSdkVersion 29
    buildToolsVersion "29.0.3"

    defaultConfig {
        applicationId "app.miuix.tavern"
        minSdkVersion 26
        targetSdkVersion 29
        versionCode 9
        versionName "0.9.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "POINTS_SERVER_URL",
                "\"${escapedPointsServerUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        doNotStrip "**/*.so"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.3.1"
    implementation "androidx.recyclerview:recyclerview:1.2.1"
    implementation "androidx.dynamicanimation:dynamicanimation:1.0.0"
    implementation "com.squareup.okhttp3:okhttp:3.12.13"
}
