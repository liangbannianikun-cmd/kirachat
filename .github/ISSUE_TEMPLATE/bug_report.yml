name: Bug report / 问题反馈
description: Report a reproducible KiraChat problem without including credentials or private chat data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove API keys, OAuth tokens, private URLs, account details, chat content, and personal information before submitting.

        感谢反馈。提交前请删除 API Key、OAuth Token、私人地址、账户信息、聊天内容和个人信息。
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting / 提交前确认
      options:
        - label: I searched existing issues and did not find the same problem. / 我已搜索已有 Issue。
          required: true
        - label: I removed credentials and private data from screenshots and logs. / 我已从截图和日志中删除凭据与隐私数据。
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Component / 模块
      options:
        - Android app
        - iOS app
        - Kira Switch
        - Sync server
        - Copilot gateway
        - Build or packaging
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and installation source / 版本与安装来源
      placeholder: "0.9.0, GitHub Release APK"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and OS / 设备与系统
      placeholder: "Android 14, arm64, device model; or iOS 18, iPhone model"
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Model route or provider / 模型连接方式
      description: Do not include private endpoints, keys, tokens, or account names.
      placeholder: "GPT-compatible Chat Completions, Gemini native, local Qwen3.5-2B, not applicable"
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Send ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots / 已脱敏日志或截图
      description: Drag files here after removing secrets, private messages, real names, and personal images.
      render: shell
  - type: dropdown
    id: frequency
    attributes:
      label: Reproducibility / 复现频率
      options:
        - Every time / 每次
        - Often / 经常
        - Sometimes / 偶尔
        - Once / 仅一次
    validations:
      required: true
